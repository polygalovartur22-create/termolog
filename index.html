/* Trusted by — собственные стили (Tailwind не используется) */
[data-trusted-row]{
  display:flex;
  flex-direction:column;       /* мобильный: 1 в столбик */
  align-items:center;
  gap:32px;                    /* мобильный: 32px между лого */
}
[data-trusted-slot]{
  display:flex;
  align-items:center;
  justify-content:center;
  height:64px;                 /* мобильный: высота слота */
  width:auto;
}
[data-trusted-slot] img{
  max-height:100%;
  max-width:100%;
  width:auto;
  height:auto;
  object-fit:contain;
  filter:grayscale(1);
  opacity:.6;
  transition:filter .3s ease, opacity .3s ease;
}
[data-trusted-slot]:hover img{
  filter:grayscale(0);
  opacity:1;
}
/* планшет 640+ : одна горизонтальная линия */
@media (min-width:640px){
  [data-trusted-row]{
    flex-direction:row;
    flex-wrap:nowrap;
    justify-content:space-between;
    gap:24px;                  /* планшет: 24px горизонтально */
  }
  [data-trusted-slot]{
    flex:1 1 0;
    min-width:0;
    height:80px;
  }
}
/* десктоп 1024+ : больше пространства */
@media (min-width:1024px){
  [data-trusted-row]{
    gap:96px;                  /* ПК: 96px горизонтально */
  }
  [data-trusted-slot]{
    height:96px;
  }
}
